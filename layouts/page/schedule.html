{{ define "main" }}
<article class="schedule-page">
    <header class="article-header">
        <h1 class="article-title">{{ .Title }}</h1>
        <div class="article-subtitle">
            {{ .Content }}
        </div>
    </header>

    <style>
        .schedule-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .schedule-card {
            background: var(--card-background);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }

        .schedule-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .schedule-card.live {
            border-color: #9146FF;
            background: linear-gradient(135deg, rgba(145, 70, 255, 0.1) 0%, var(--card-background) 100%);
        }

        .schedule-card.live::before {
            content: "🔴 LIVE";
            display: inline-block;
            background: #9146FF;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }

        .schedule-card.discord {
            border-color: #5865F2;
            background: linear-gradient(135deg, rgba(88, 101, 242, 0.1) 0%, var(--card-background) 100%);
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.3);
        }

        .schedule-card.discord:hover {
            box-shadow: 0 8px 16px rgba(88, 101, 242, 0.4);
        }

        .schedule-card.discord::before {
            content: "🔴 LIVE";
            display: inline-block;
            background: #5865F2;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .day-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: var(--accent-color);
        }

        .time-slot {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0.75rem 0;
            padding: 0.5rem;
            background: var(--body-background);
            border-radius: 6px;
        }

        .time-icon {
            font-size: 1.2rem;
        }

        .time-info {
            flex: 1;
        }

        .time {
            font-weight: 600;
            color: var(--accent-color);
        }

        .activity {
            font-size: 0.9rem;
            color: var(--card-text-color-secondary);
            margin-top: 0.25rem;
        }

        .game-tag {
            display: inline-block;
            background: var(--accent-color);
            color: black;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }

        .discord-button {
            display: inline-block;
            background: #5865F2;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 0.75rem;
            transition: background 0.2s;
            font-size: 0.9rem;
        }

        .discord-button:hover {
            background: #4752C4;
        }

        .no-stream {
            opacity: 0.6;
            font-style: italic;
            text-align: center;
            padding: 2rem;
        }

        .timezone-note {
            text-align: center;
            margin: 2rem 0;
            padding: 1rem;
            background: var(--card-background);
            border-radius: 8px;
            color: var(--card-text-color-secondary);
        }

        .twitch-link {
            display: inline-block;
            background: #9146FF;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 2rem;
            transition: background 0.2s;
        }

        .twitch-link:hover {
            background: #772CE8;
        }

        @media (max-width: 768px) {
            .schedule-grid {
                grid-template-columns: 1fr;
            }
        }

        .vacation-banner {
            background: linear-gradient(135deg, rgba(255, 180, 0, 0.15) 0%, rgba(255, 140, 0, 0.1) 100%);
            border: 2px solid #ffb400;
            border-radius: 12px;
            padding: 1.5rem 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .vacation-banner .vacation-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffb400;
            margin-bottom: 0.5rem;
        }

        .vacation-banner .vacation-reason {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--body-text-color);
        }

        .vacation-banner .vacation-return {
            font-size: 1.4rem;
            font-style: italic;
            color: var(--body-text-color);
        }

        .schedule-grid.on-vacation .schedule-card {
            opacity: 0.45;
            pointer-events: none;
        }

        .vods-section {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 2px solid var(--card-background);
        }

        .vods-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: var(--accent-color);
        }

        .vods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .vod-card {
            background: var(--card-background);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .vod-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .vod-thumbnail {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: linear-gradient(135deg, rgba(145, 70, 255, 0.2) 0%, rgba(145, 70, 255, 0.05) 100%);
            overflow: hidden;
        }

        .vod-thumbnail img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .vod-play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            transition: background 0.2s;
        }

        .vod-card:hover .vod-play-icon {
            background: rgba(145, 70, 255, 0.9);
        }

        .vod-info {
            padding: 1rem;
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .vod-icon {
            font-size: 1.5rem;
        }

        .vod-details {
            flex: 1;
        }

        .vod-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: white;
        }

        .vod-channel {
            font-size: 0.9rem;
            color: var(--card-text-color-secondary);
        }
    </style>

    <div class="schedule-container" id="schedule-container">
        <div id="schedule-timezone"></div>
        <div id="schedule-vacation"></div>
        <div class="schedule-grid" id="schedule-grid"></div>
        <div id="schedule-vods"></div>
        <div id="schedule-footer"></div>
    </div>
</article>

<script>
(function () {
    var SCHEDULE_DATA_URL = "{{ site.Params.scheduleDataUrl }}";
    var DAY_NAMES = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
    var DAY_LABELS = { monday: 'Monday', tuesday: 'Tuesday', wednesday: 'Wednesday', thursday: 'Thursday', friday: 'Friday', saturday: 'Saturday', sunday: 'Sunday' };
    var DAYS_ORDER = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];

    function parseTime(str) {
        var parts = str.split(':');
        return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function renderSchedule(data) {
        var vacation = data.vacation || {};
        var onVacation = vacation.enabled === true;

        if (data.timezone) {
            document.getElementById('schedule-timezone').innerHTML =
                '<div class="timezone-note">⏰ All times shown in ' + escapeHtml(data.timezone) + '</div>';
        }

        if (onVacation) {
            var banner = '<div class="vacation-banner">' +
                '<div class="vacation-title">🏖️ Currently on Vacation</div>';
            if (vacation.reason) banner += '<div class="vacation-reason">' + escapeHtml(vacation.reason) + '</div>';
            if (vacation.return_date) banner += '<div class="vacation-return">Expected return: ' + escapeHtml(vacation.return_date) + '</div>';
            banner += '</div>';
            document.getElementById('schedule-vacation').innerHTML = banner;
        }

        var grid = document.getElementById('schedule-grid');
        if (onVacation) grid.classList.add('on-vacation');
        grid.dataset.vacation = onVacation ? 'true' : 'false';

        var schedule = data.schedule || {};
        var cardsHtml = '';
        DAYS_ORDER.forEach(function (dayKey) {
            var daySchedule = schedule[dayKey];
            var dayName = DAY_LABELS[dayKey];
            if (daySchedule && daySchedule.length > 0) {
                daySchedule.forEach(function (slot) {
                    var isDiscord = slot.discord === true;
                    var isManualLive = slot.live === true;
                    cardsHtml += '<div class="schedule-card" data-day="' + dayKey + '" data-time="' + escapeHtml(slot.time || '') + '" data-discord="' + (isDiscord ? 'true' : 'false') + '" data-live="' + (isManualLive ? 'true' : 'false') + '">';
                    cardsHtml += '<div class="day-title">' + escapeHtml(dayName) + '</div>';
                    cardsHtml += '<div class="time-slot">';
                    cardsHtml += '<div class="time-icon">' + escapeHtml(slot.icon || '') + '</div>';
                    cardsHtml += '<div class="time-info">';
                    cardsHtml += '<div class="time">' + escapeHtml(slot.time || '') + '</div>';
                    cardsHtml += '<div class="activity">' + escapeHtml(slot.activity || '') + '</div>';
                    if (slot.tag) cardsHtml += '<span class="game-tag">' + escapeHtml(slot.tag) + '</span>';
                    cardsHtml += '</div></div>';
                    if (isDiscord && data.discord_url) {
                        cardsHtml += '<div style="text-align: center;"><a href="' + escapeHtml(data.discord_url) + '" class="discord-button" target="_blank">💬 Join on Discord</a></div>';
                    } else if (!isDiscord && data.twitch_url) {
                        cardsHtml += '<div class="twitch-live-btn" style="text-align: center; display: none;"><a href="' + escapeHtml(data.twitch_url) + '" class="discord-button" style="background: #9146FF;" target="_blank">📺 Watch on Twitch</a></div>';
                    }
                    cardsHtml += '</div>';
                });
            } else {
                cardsHtml += '<div class="schedule-card"><div class="day-title">' + escapeHtml(dayName) + '</div><div class="no-stream">No stream scheduled</div></div>';
            }
        });
        grid.innerHTML = cardsHtml;

        if (data.vods && data.vods.length > 0) {
            var vodsHtml = '<div class="vods-section"><h2 class="vods-title">Latest Videos</h2><div class="vods-grid">';
            data.vods.forEach(function (vod) {
                vodsHtml += '<a href="' + escapeHtml(vod.url) + '" class="vod-card" target="_blank">';
                if (vod.thumbnail) {
                    vodsHtml += '<div class="vod-thumbnail"><img src="' + escapeHtml(vod.thumbnail) + '" alt="' + escapeHtml(vod.title) + '" loading="lazy"><div class="vod-play-icon">▶</div></div>';
                }
                vodsHtml += '<div class="vod-info"><div class="vod-icon">' + escapeHtml(vod.icon || '') + '</div>';
                vodsHtml += '<div class="vod-details"><div class="vod-title">' + escapeHtml(vod.title) + '</div><div class="vod-channel">' + escapeHtml(vod.channel) + '</div></div></div></a>';
            });
            vodsHtml += '</div></div>';
            document.getElementById('schedule-vods').innerHTML = vodsHtml;
        }

        if (data.twitch_url) {
            document.getElementById('schedule-footer').innerHTML =
                '<div class="timezone-note" style="margin-top: 2rem;">💡 <strong>Note:</strong> Schedule is subject to change. Follow me on <a href="' + escapeHtml(data.twitch_url) + '" target="_blank">Twitch</a> to get notified when I go live!</div>';
        }

        updateLiveStatus();
        setInterval(updateLiveStatus, 60000);
    }

    function updateLiveStatus() {
        var grid = document.getElementById('schedule-grid');
        if (!grid || grid.dataset.vacation === 'true') return;
        var now = new Date();
        var currentDay = DAY_NAMES[now.getUTCDay()];
        var currentMinutes = now.getUTCHours() * 60 + now.getUTCMinutes();

        grid.querySelectorAll('.schedule-card[data-day]').forEach(function (card) {
            var cardDay = card.dataset.day;
            var timeStr = card.dataset.time || '';
            var isDiscord = card.dataset.discord === 'true';
            var hasManualLive = card.dataset.live === 'true';

            card.classList.remove('live', 'discord');

            var twitchBtn = card.querySelector('.twitch-live-btn');
            if (twitchBtn) twitchBtn.style.display = 'none';

            var isLive = hasManualLive;

            if (!hasManualLive) {
                if (cardDay !== currentDay) return;

                isLive = true;
                var match = timeStr.match(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/);
                if (match) {
                    var start = parseTime(match[1]);
                    var end = parseTime(match[2]);
                    isLive = currentMinutes >= start && currentMinutes <= end;
                }
            }

            if (!isLive) return;

            card.classList.add(isDiscord ? 'discord' : 'live');
            if (twitchBtn && !isDiscord) twitchBtn.style.display = '';
        });
    }

    fetch(SCHEDULE_DATA_URL)
        .then(function (res) { return res.json(); })
        .then(renderSchedule)
        .catch(function (err) {
            console.error('Failed to load schedule data from ' + SCHEDULE_DATA_URL, err);
            document.getElementById('schedule-grid').innerHTML = '<div class="schedule-card"><div class="no-stream">Schedule unavailable</div></div>';
        });
})();
</script>
{{ end }}
