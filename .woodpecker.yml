clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: true

steps:
  build:
    image: klakegg/hugo:0.92.2-ext-ubuntu
    commands:
      - hugo --minify
    when:
      event: push
  publish:
    image: alpine
    secrets: [ ssh_key ]
    commands:
      - apk add rsync openssh-client
      - eval `ssh-agent -s`
      - echo "$SSH_KEY" | tr -d '\r' | ssh-add -
      - rsync -e "ssh -o StrictHostKeyChecking=no" -r ./public/* vylpes@192.168.68.120:/home/vylpes/apps/website
    when:
      - branch: main
      - event: push